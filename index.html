<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ecommerce Tienda de Audífonos - Andrea Suarez</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #c7eaf7;
      color: #123b4d;
      padding: 20px;
      text-align: center;
      margin: 0;
    }

    h1 {
      color: #075b78;
      margin-bottom: 30px;
    }

    #productos {
      max-width: 1200px;
      margin: auto;
    }

    .producto {
      border: 1px solid #75c7e3;
      background: #f5fcff;
      border-radius: 8px;
      padding: 10px;
      margin: 10px;
      display: inline-block;
      width: 220px;
      vertical-align: top;
      box-shadow: 0 3px 8px rgba(7, 91, 120, 0.18);
      min-height: 350px;
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
    }

    .producto h3 {
      font-size: 16px;
      min-height: 70px;
    }

    .producto p {
      font-weight: bold;
      color: #075b78;
    }

    .producto button,
    .carrito button {
      background-color: #1597c2;
      border: none;
      color: white;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .producto button:hover,
    .carrito button:hover {
      background-color: #08749a;
    }

    .carrito {
      margin: 30px auto;
      padding: 20px;
      background: #f5fcff;
      border: 1px solid #75c7e3;
      border-radius: 8px;
      text-align: left;
      max-width: 600px;
      box-shadow: 0 3px 8px rgba(7, 91, 120, 0.18);
    }

    .carrito h2 {
      color: #075b78;
      text-align: center;
    }

    .carrito ul {
      padding-left: 25px;
    }

    .carrito li {
      margin-bottom: 8px;
    }

    .carrito button.vaciar {
      background-color: #238bb0;
      margin-top: 10px;
    }

    .carrito button.vaciar:hover {
      background-color: #126b88;
    }

    .boton-finalizar {
      background-color: #075b78 !important;
      margin-left: 5px;
    }

    .boton-finalizar:hover {
      background-color: #043f54 !important;
    }

    #total {
      color: #075b78;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Ecommerce Tienda De Audífonos - Andrea Suarez</h1>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <p>
      <strong>
        Total: $<span id="total">0.00</span>
      </strong>
    </p>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Audífonos de Diadema SONY Inalámbricos Bluetooth On Ear WH-CH520 Negro",
        precio: 25.00,
        imagen: "https://www.alkomprar.com/medias/027242925205-001-750Wx750H?context=bWFzdGVyfGltYWdlc3wxMTEyNnxpbWFnZS93ZWJwfGFEZGxMMmcyTXk4eE5ETTFNRFE0TkRjek16azRNaTh3TWpjeU5ESTVNalV5TURWZk1EQXhYemMxTUZkNE56VXdTQXw4OGE0Yzg0MjhlNzlkOGEwNWMzNDdkM2ExM2I0ZjMzNjA4ZDA3NWRmNTEzYzI4YTMyN2VjYmE4ZjQ1ZmZmMzgz"
      },
      {
        id: 2,
        nombre: "Audífonos Inalámbricos Sony WI-C100 Negro",
        precio: 18.00,
        imagen: "https://audiocolor.co/cdn/shop/files/AUDIFONOS-INALAMBRICOS-SONY-NEGRO-WI-C100BZ-UC-5.jpg?v=1722631209"
      },
      {
        id: 3,
        nombre: "AirPods 4",
        precio: 30.00,
        imagen: "https://co.tiendasishop.com/cdn/shop/files/IMG-14858589.jpg?v=1726245557&width=823"
      },
      {
        id: 4,
        nombre: "Audífonos HUAWEI Inalámbricos Bluetooth Open Ear FreeClip Negro",
        precio: 18.00,
        imagen: "https://www.ktronix.com/medias/6942103112225-001-1400Wx1400H?context=bWFzdGVyfGltYWdlc3wzMzY2NHxpbWFnZS93ZWJwfGFEZGlMMmhqTmk4eE5ETTJOamt6Tnprd056SXpNQzgyT1RReU1UQXpNVEV5TWpJMVh6QXdNVjh4TkRBd1YzZ3hOREF3U0F8YmExNzQ0ZmJhNDllMzAzZWMxZGJlMWYzZWY1ODRkNGM4MGJlN2M4ZjkwZGNjZjg1NjgzNmE0YTQwMDhiYjZmYQ"
      },
      {
        id: 5,
        nombre: "Audifonos de 3.5Mm de Media Pulgada Modelo W001031 Negro",
        precio: 22.00,
        imagen: "https://minisocol.vtexassets.com/arquivos/ids/219210/Audifonos-de-3-5Mm-de-Media-Pulgada-Modelo-W001031-Negro-1-14273.jpg?v=638041750523700000"
      }
    ];

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");

    function mostrarProductos() {
      productos.forEach(prod => {
        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">
          <h3>${prod.nombre}</h3>
          <p>Precio: $${prod.precio.toFixed(2)}</p>
          <button onclick="agregarAlCarrito(${prod.id})">
            🛒 Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);
      });
    }

    function agregarAlCarrito(id) {
      const productoExistente = carrito.find(p => p.id === id);

      if (productoExistente) {
        productoExistente.cantidad++;
      } else {
        const producto = productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });
      }

      actualizarCarrito();
    }

    function actualizarCarrito() {
      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {
        const li = document.createElement("li");

        li.textContent =
          `${item.nombre} x${item.cantidad} - $${(
            item.precio * item.cantidad
          ).toFixed(2)}`;

        listaCarrito.appendChild(li);

        total += item.precio * item.cantidad;
        totalItems += item.cantidad;
      });

      totalCarrito.textContent = total.toFixed(2);

      actualizarTituloCarrito(totalItems);
    }

    function actualizarTituloCarrito(cantidad) {
      const titulo = document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;
    }

    function vaciarCarrito() {
      if (confirm("¿Estás seguro de que quieres vaciar el carrito?")) {
        carrito.length = 0;

        actualizarCarrito();
      }
    }

    function finalizarCompra() {
      if (carrito.length === 0) {
        alert(
          "El carrito está vacío. Agrega productos antes de finalizar la compra."
        );
        return;
      }

      alert(
        "🎉 ¡Gracias por tu compra! En breve recibirás un correo de confirmación."
      );

      carrito.length = 0;

      actualizarCarrito();
    }

    const botonFinalizar = document.createElement("button");

    botonFinalizar.textContent = "✅ Finalizar Compra";

    botonFinalizar.className = "boton-finalizar";

    botonFinalizar.onclick = finalizarCompra;

    document
      .querySelector(".carrito")
      .appendChild(botonFinalizar);

    mostrarProductos();
  </script>

</body>
</html>
